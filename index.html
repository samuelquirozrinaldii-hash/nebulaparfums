<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="siteTitle">Nébula Parfums</title>
<link rel="icon" type="image/png" href="https://i.ibb.co/jZ5y4GpK/NE-BULA-BLANCO.png">
<meta name="description" content="Nébula Parfums — TU PRESENCIA HABLA ANTES QUE TU.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --void: #0a0a0a;
    --ink: #0a0a0a;
    --stardust: #f5f5f7;
    --stardust-dim: #a1a1a6;
    --gold-mist: #b8996b;
    --gold-mist-bright: #b8996b;
    --hairline: rgba(184, 153, 107, 0.35);
    --font-heading: 'Cormorant Garamond', serif;
    --font-body: 'Manrope', sans-serif;
    --bg-image-url: url('https://i.ibb.co/3yKHhXX4/Perfumes-Nebula-Fondo.png');
    --max-w: 1180px;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background-color: var(--void);
    background-image: var(--bg-image-url);
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: var(--stardust);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  h1, h2, h3 {
    font-family: var(--font-heading);
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  a { color: inherit; text-decoration: none !important; }
  img { max-width: 100%; display: block; }
  button { font-family: inherit; cursor: pointer; }

  .wrap { max-width: var(--max-w); margin: 0 auto; padding: 0 28px; }

  header {
    position: sticky;
    top: 0;
    z-index: 40;
    backdrop-filter: blur(10px);
    background: transparent;
  }
  .header-inner {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 28px;
    max-width: var(--max-w); margin: 0 auto;
  }
  .logo-link img { height: 42px; width: auto; object-fit: contain; }
  nav.top-nav { display: flex; align-items: center; gap: 28px; }
  nav.top-nav a { color: #ffffff !important; }
  nav.top-nav a:hover { color: var(--gold-mist-bright) !important; }

  .hero {
    position: relative;
    min-height: 60vh;
    display: flex;
    align-items: flex-end;
    padding-bottom: 60px;
    background: transparent; 
  }
  .hero-content { position: relative; z-index: 2; max-width: var(--max-w); margin: 0 auto; padding: 0 28px; width: 100%; }
  .hero h1 {
    font-size: clamp(2.5rem, 5.5vw, 4.4rem);
    line-height: 1.08;
    margin: 0 0 22px;
    max-width: 16ch;
    color: var(--stardust);
  }
  .hero p { color: #d1d1d1 !important; font-size: 1.1rem; max-width: 50ch; margin-bottom: 28px; }

  .btn-primary {
    display: inline-block;
    background: transparent;
    border: 1px solid var(--gold-mist) !important;
    color: var(--gold-mist-bright);
    padding: 14px 32px;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border-radius: 4px;
    transition: all 0.3s ease;
  }
  .btn-primary:hover { background: var(--gold-mist); color: #000; }

  /* CATÁLOGO DE PRODUCTOS */
  .catalog { padding: 40px 0 60px; }
  .section-head {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 20px; flex-wrap: wrap;
    border-bottom: 1px solid var(--hairline);
    padding-bottom: 22px; margin-bottom: 36px;
  }
  .section-head h2 { font-size: 2.2rem; margin: 0; }
  .section-head .count { color: #d1d1d1 !important; }

  .controls {
    display: flex; gap: 24px; flex-wrap: wrap;
    margin-bottom: 44px;
  }
  .field { flex: 1 1 260px; position: relative; }
  .field label { color: #ffffff !important; }
  .field input, .field select {
    width: 100%;
    background: rgba(0,0,0,0.5);
    border: 1px solid var(--hairline);
    color: var(--stardust);
    font-family: inherit;
    font-size: 0.95rem;
    padding: 10px 12px;
    border-radius: 4px;
  }
  .field select option { background: var(--ink); color: var(--stardust); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 24px;
  }
  .card {
    background: var(--ink);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    padding: 24px;
    display: flex; flex-direction: column;
    transition: transform 0.3s ease, border-color 0.3s ease;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: var(--gold-mist);
  }
  .card-img {
    width: 100%;
    aspect-ratio: 3/4;
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 20px;
    background: linear-gradient(160deg, rgba(255,255,255,0.05), rgba(0,0,0,0.4));
    display: flex; align-items: center; justify-content: center;
  }
  .card-img img { width: 100%; height: 100%; object-fit: contain; padding: 12px; }
  .card h3 { font-size: 1.5rem; margin: 0 0 8px; color: var(--stardust); }
  .card .notes { color: #d1d1d1 !important; }
  .card .price {
    font-family: var(--font-heading);
    font-size: 1.4rem; color: var(--gold-mist-bright);
    margin: 0 0 18px; font-weight: 600;
  }
  .btn-buy {
    display: block;
    background: transparent;
    border: 1px solid var(--hairline) !important;
    color: var(--stardust);
    padding: 12px 18px;
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-align: center;
    border-radius: 4px;
    transition: all 0.25s ease;
  }
  .btn-buy:hover { border-color: var(--gold-mist-bright) !important; color: var(--gold-mist-bright); background: rgba(184,153,107,0.1); }

  footer {
    border-top: 1px solid var(--hairline);
    padding: 40px 0;
    margin-top: 60px;
    background: rgba(0,0,0,0.5);
  }
  .footer-inner {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 20px;
  }
  .footer-inner img { height: 32px; width: auto; }
  .footer-copy { color: #a1a1a6 !important; }

  .toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--ink); border: 1px solid var(--gold-mist); color: var(--stardust);
    padding: 12px 28px; font-size: 0.88rem; z-index: 200; border-radius: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    opacity: 0; transition: opacity 0.3s ease, transform 0.3s ease;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="#top" class="logo-link">
      <img src="https://i.ibb.co/Kp7QbvvW/image-removebg-preview.png" alt="Nébula Parfums">
    </a>
    <nav class="top-nav">
      <a href="#coleccion">Colección</a>
      <a href="https://www.instagram.com/nebulaparfums/" target="_blank" rel="noopener">Instagram</a>
    </nav>
  </div>
</header>

<section class="hero" id="top">
  <div class="hero-content">
    <h1>TU PRESENCIA HABLA ANTES QUE TU.</h1>
    <p>Fragancias exclusivas para quienes no pasan desapercibidos.</p>
    <a href="#coleccion" class="btn-primary">EXPLORAR LA COLECCIÓN</a>
  </div>
</section>

<!-- CATÁLOGO DE PRODUCTOS -->
<main class="catalog wrap" id="coleccion">
  <div class="section-head">
    <h2>La colección</h2>
    <span class="count" id="resultsCount">0 fragancias</span>
  </div>

  <div class="controls">
    <div class="field">
      <label for="searchInput">Buscar por nombre o notas</label>
      <input type="text" id="searchInput" placeholder="Ej: Afnan, Lataffa, Ahli..." autocomplete="off">
    </div>
    <div class="field" style="flex:0 1 260px;">
      <label for="sortSelect">Ordenar por</label>
      <select id="sortSelect">
        <option value="default">Recomendados</option>
        <option value="price-desc">Precio: de mayor a menor</option>
        <option value="price-asc">Precio: de menor a mayor</option>
      </select>
    </div>
  </div>

  <div class="grid" id="productGrid"></div>
</main>

<footer>
  <div class="wrap">
    <div class="footer-inner">
      <a href="#top" class="logo-link">
        <img src="https://i.ibb.co/Kp7QbvvW/image-removebg-preview.png" alt="Nébula Parfums">
      </a>
      <a href="https://www.instagram.com/nebulaparfums/" target="_blank" rel="noopener">@nebulaparfums</a>
    </div>
    <p class="footer-copy">© 2026 Nébula Parfums.</p>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script>
(function() {
  'use strict';

  const STORAGE_KEY_PRODUCTS = 'nebulaParfums_products_v4';

  const defaultProducts = [
    {
      id: 'p1',
      name: 'Afnan 9 PM Elixir',
      notes: 'Una fragancia masculina de perfil especiado y oriental, de la casa Afnan. Afnan 9 PM Elixir combina ingredientes cuidadosamente seleccionados para lograr un aroma distintivo, versátil y de buena proyección.',
      price: 280000,
      image: 'https://i.ibb.co/XZWy6sJz/image.png'
    },
    {
      id: 'p2',
      name: 'Jean Paul Gaultier Le Male Le Parfum Eau de Parfum',
      notes: 'Una fragancia masculina de perfil amaderado y especiado, de la casa Jean Paul Gaultier. Jean Paul Gaultier Le Male Le Parfum combina ingredientes cuidadosamente seleccionados para lograr un aroma distintivo, versátil y de buena...',
      price: 530000,
      image: 'https://i.ibb.co/sJdvHJRP/image.png'
    },
    {
      id: 'p3',
      name: 'Carolina Herrera Good Girl Blush Elixir Eau de Parfum',
      notes: 'Una fragancia femenina de perfil cítrico y floral, de la casa Carolina Herrera. Carolina Herrera Good Girl Blush Elixir combina ingredientes cuidadosamente seleccionados para lograr un aroma distintivo, versátil y de buena proyección.',
      price: 610000,
      image: 'https://i.ibb.co/NnZTMBGc/image.png'
    },
    {
      id: 'p4',
      name: 'Afnan 9PM Eau de Parfum',
      notes: 'Una fragancia masculina de perfil amaderado y floral, de la casa Afnan. Afnan 9 PM Masculina combina ingredientes cuidadosamente seleccionados para lograr un aroma distintivo, versátil y de buena proyección.',
      price: 230000,
      image: 'https://i.ibb.co/RTPhBHnR/image.png'
    }
  ];

  let products = [];

  const formatCOP = (value) => new Intl.NumberFormat('es-CO', {
    style: 'currency', currency: 'COP', maximumFractionDigits: 0
  }).format(value);

  function loadProducts() {
    try {
      const storedProducts = localStorage.getItem(STORAGE_KEY_PRODUCTS);
      products = storedProducts ? JSON.parse(storedProducts) : [...defaultProducts];
    } catch(e) {
      products = [...defaultProducts];
    }
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, s => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[s]));
  }

  function getFilteredProducts() {
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    const sortValue = document.getElementById('sortSelect').value;

    let list = products.filter(p =>
      p.name.toLowerCase().includes(query) || p.notes.toLowerCase().includes(query)
    );

    if(sortValue === 'price-desc') list.sort((a,b)=> b.price - a.price);
    else if(sortValue === 'price-asc') list.sort((a,b)=> a.price - b.price);

    return list;
  }

  function renderCatalog() {
    const grid = document.getElementById('productGrid');
    const list = getFilteredProducts();
    const countLabel = document.getElementById('resultsCount');
    countLabel.textContent = list.length + (list.length === 1 ? ' fragancia' : ' fragancias');

    if(list.length === 0){
      grid.innerHTML = `
        <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--stardust-dim);">
          <h3>No se encontraron fragancias</h3>
          <p>Intenta buscar con otro término.</p>
        </div>`;
      return;
    }

    grid.innerHTML = list.map(p => `
      <article class="card">
        <div class="card-img">
          <img src="${escapeHtml(p.image)}" alt="${escapeHtml(p.name)}"
               onerror="this.style.display='none';">
        </div>
        <h3>${escapeHtml(p.name)}</h3>
        <p class="notes">${escapeHtml(p.notes)}</p>
        <p class="price">${formatCOP(p.price)}</p>
        <a class="btn-buy" href="https://www.instagram.com/nebulaparfums/" target="_blank" rel="noopener">Comprar</a>
      </article>
    `).join('');
  }

  document.getElementById('searchInput').addEventListener('input', renderCatalog);
  document.getElementById('sortSelect').addEventListener('change', renderCatalog);

  loadProducts();
  renderCatalog();
})();
</script>
</body>
</html>
